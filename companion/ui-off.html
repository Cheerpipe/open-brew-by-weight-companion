<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Brew by Weight Companion</title>
<style>@STYLE@</style>
</head>
<body>
<main>
  <p class="muted">Open Brew by Weight Companion</p>
  <h1 id="title"></h1>
  <section class="card">
    <p id="intro"></p>
    <a class="button" id="open" href="@ADDRESS@/" hidden>@ADDRESS@</a>
    <p id="help" class="muted"></p>
  </section>
</main>
<script>
(function () {
  var T = {
    en: {
      title: "Open the Web UI on the controller",
      intro: "Your controller is set to show its Web UI directly, not through this companion. Open it at its own address:",
      none: "The companion has not found the controller yet. Open the Web UI at the controller's own address.",
      help: "To use the companion's secure address again, turn on Web UI through the companion in Admin → Companion."
    },
    es: {
      title: "Abre la Web UI en el controlador",
      intro: "Tu controlador está configurado para mostrar su Web UI directamente, no a través de este companion. Ábrela en su propia dirección:",
      none: "El companion aún no encuentra el controlador. Abre la Web UI en la dirección del propio controlador.",
      help: "Para volver a usar la dirección segura del companion, activa Web UI a través del companion en Admin → Companion."
    }
  };
  var lang = /^es/i.test(navigator.language || "") ? "es" : "en", t = T[lang], open = document.getElementById("open");
  document.documentElement.lang = lang;
  document.getElementById("title").textContent = t.title;
  open.hidden = !open.textContent;
  document.getElementById("intro").textContent = open.hidden ? t.none : t.intro;
  document.getElementById("help").textContent = t.help;
})();
</script>
</body>
</html>
