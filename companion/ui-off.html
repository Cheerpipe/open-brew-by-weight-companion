<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Brew by Weight Companion</title>
<style>@STYLE@</style>
</head>
<body>
<main>
  <nav class="menu">
    <a id="m-webui" href="/">Web UI</a>
    <a id="m-access" href="/"></a>
    <a id="m-companion" href="/__companion/">Companion</a>
  </nav>
  <p class="muted">Open Brew by Weight Companion</p>
  <h1 id="title"></h1>
  <section class="card">
    <p id="intro"></p>
    <a class="button" id="open" href="@ADDRESS@/" hidden>@ADDRESS@</a>
    <p id="help" class="muted"></p>
  </section>
</main>
<footer>
  <div>Companion @VERSION@ · @NAME@</div>
  <div><a href="https://github.com/Cheerpipe/open-brew-by-weight-companion" target="_blank" rel="noopener">GitHub</a>
    <span id="made-by">· Made by</span>
    <a href="https://github.com/Cheerpipe" target="_blank" rel="noopener">Cheerpipe</a></div>
</footer>
<script>
(function () {
  var T = {
    en: {
      title: "Open the Web UI on the controller",
      intro: "Your controller is set to show its Web UI directly, not through this companion. Open it at its own address:",
      none: "The companion has not found the controller yet. Open the Web UI at the controller's own address.",
      help: "To use the companion's secure address again, turn on Web UI through the companion in Admin → Companion.",
      madeBy: "· Made by"
    },
    es: {
      title: "Abre la Web UI en el controlador",
      intro: "Tu controlador está configurado para mostrar su Web UI directamente, no a través de este companion. Ábrela en su propia dirección:",
      none: "El companion aún no encuentra el controlador. Abre la Web UI en la dirección del propio controlador.",
      help: "Para volver a usar la dirección segura del companion, activa Web UI a través del companion en Admin → Companion.",
      madeBy: "· Hecho por"
    }
  };
  var lang = /^es/i.test(navigator.language || "") ? "es" : "en", t = T[lang], open = document.getElementById("open");
  document.documentElement.lang = lang;
  document.getElementById("title").textContent = t.title;
  open.hidden = !open.textContent;
  document.getElementById("intro").textContent = open.hidden ? t.none : t.intro;
  document.getElementById("help").textContent = t.help;
  document.getElementById("made-by").textContent = t.madeBy;
  // The menu's addresses: the secure Web UI and the plain-HTTP pages beside it.
  document.getElementById("m-access").textContent = /^es/i.test(navigator.language || "") ? "Acceso seguro" : "Secure access";
  fetch("/__companion/gateway", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (g) {
    document.getElementById("m-webui").href = g.secure_url + "/";
    // Plain HTTP: the access page is this server's root; over HTTPS the root is the Web UI.
    if (location.protocol === "https:") document.getElementById("m-access").href = g.setup_url + "/";
  }, function () {});
})();
</script>
</body>
</html>
