# Joins a macvlan or ipvlan network that already exists on the server, for
# example one another container uses, instead of creating a new one. Docker
# refuses a second network over the same LAN range. Enable it in .env:
#   COMPOSE_FILE=compose.yaml:compose.existing-network.yaml
#   LAN_NETWORK=<network name from `docker network ls`>
networks:
  lan: !override
    name: ${LAN_NETWORK:?set LAN_NETWORK in .env}
    external: true
