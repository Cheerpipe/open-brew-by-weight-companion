# Open Brew by Weight HTTPS gateway. Run ./setup, which writes .env and starts
# it, or copy .env.example to .env, fill it in and run: docker compose up -d
services:
  gateway:
    build: .
    image: openbrewbyweight-https-gateway:local
    container_name: openbrewbyweight-https-gateway
    restart: unless-stopped
    environment:
      GATEWAY_HOSTNAME: ${GATEWAY_HOSTNAME:-openbrewbyweight-secure}
      GATEWAY_IP: ${GATEWAY_IP:-}
      HTTP_PORT: ${HTTP_PORT:-80}
      HTTPS_PORT: ${HTTPS_PORT:-443}
      OBBW_CONTROLLER_URL: ${OBBW_CONTROLLER_URL:-}
      OBBW_CONTROLLER_NAME: ${OBBW_CONTROLLER_NAME:-}
      MDNS_PUBLISH: ${MDNS_PUBLISH:-true}
    volumes:
      - ${GATEWAY_DATA:-./data}:/data
    networks:
      lan:
        ipv4_address: ${GATEWAY_IP}

# The gateway gets its own address on the LAN, so it keeps ports 80 and 443
# and its own mDNS responder even when the server already uses them.
networks:
  lan:
    driver: ${LAN_DRIVER:-macvlan}
    driver_opts:
      parent: ${LAN_INTERFACE:-}
    ipam:
      config:
        - subnet: ${LAN_SUBNET:-}
          gateway: ${LAN_ROUTER:-}
